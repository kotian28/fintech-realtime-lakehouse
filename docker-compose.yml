name: fintech-lakehouse

services:
  init-perms:
    image: busybox
    command: sh -c "mkdir -p /data/gold && chmod -R 777 /data"
    volumes: ["./data:/data"]

  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 15
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: ["/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 3 --replication-factor 1"]

  producer:
    build: {context: ., dockerfile: docker/app.Dockerfile}
    image: fintech-app
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      EVENTS_PER_SEC: "15"
    volumes: ["./src:/app/src"]
    command: python /app/src/producer/producer.py
    restart: on-failure

  spark-streaming:
    build: {context: ., dockerfile: docker/spark.Dockerfile}
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      init-perms: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      LAKE_ROOT: /data
    volumes:
      - ./src:/app/src
      - ./data:/data
      - ivy-cache:/root/.ivy2
    working_dir: /app/src/streaming
    command: python stream_job.py
    restart: on-failure

  airflow:
    build: {context: ., dockerfile: docker/airflow.Dockerfile}
    depends_on:
      init-perms: {condition: service_completed_successfully}
    ports: ["8080:8080"]
    environment:
      LAKE_ROOT: /opt/airflow/data
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./src/quality:/opt/airflow/quality
      - ./data:/opt/airflow/data
    command:
      - bash
      - -c
      - >
        airflow db migrate &&
        airflow users create --username admin --password admin --role Admin
        --firstname Data --lastname Eng --email admin@example.com;
        airflow webserver --port 8080 & exec airflow scheduler

  dashboard:
    image: fintech-app
    depends_on:
      producer: {condition: service_started}
    ports: ["8501:8501"]
    environment:
      LAKE_ROOT: /data
    volumes: ["./src:/app/src", "./data:/data"]
    command: streamlit run /app/src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  ivy-cache:
